[package]
name = "watermark-remover"
version = "0.1.1"
edition = "2021"
description = "Local inverse-blend watermark remover"
license = "MIT"
publish = false

[lib]
name = "watermark_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
watermark-core = { path = "../crates/watermark-core" }
