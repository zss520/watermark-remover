[package]
name = "watermark-cli"
version = "0.1.2"
edition = "2021"
description = "Calibrate, verify, and remove known watermarks"
license = "MIT"
publish = false

[[bin]]
name = "watermark-cli"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = "=0.25.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
watermark-core = { path = "../watermark-core" }
